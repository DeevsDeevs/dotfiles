unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Prefix key
set -g prefix C-s

# Clipboard passthrough
set -gq allow-passthrough on

# Mouse support
set -g mouse on

# Indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Copy mode with Vim keys
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split window retains current path
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Status bar position
set -g status-position top

### === Plugins (via Nix/Devbox) === ###
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/devbox/global/default/.devbox/nix/profile/default/share/tmux-plugins"

# Tmuxifier setup (binary tool, not a plugin)
set-environment -g TMUXIFIER_LAYOUT_PATH "$HOME/.config/tmuxifier"

### === Plugin Configuration === ###
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'
set -g @yank_selection_mouse 'clipboard'

### === Everforest Palette === ###
set -g @ef_bg "#272e33"
set -g @ef_fg "#d3c6aa"
set -g @ef_grey "#859289"
set -g @ef_surface "#414b50"
set -g @ef_green "#a7c080"
set -g @ef_aqua "#83c092"
set -g @ef_blue "#7fbbb3"
set -g @ef_yellow "#dbbc7f"
set -g @ef_orange "#e69875"
set -g @ef_red "#e67e80"

# Status bar style
set -g status-style "bg=#{@ef_bg}"
set -g status-justify "centre"

# Pane border look
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@ef_bg},fg=#{@ef_grey}"
setw -g pane-border-style "bg=#{@ef_bg},fg=#{@ef_surface}"
setw -g pane-border-lines single

### === Window Titles (Project Name) === ###

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@ef_bg},fg=#{@ef_fg}"
set -g window-status-last-style "bg=#{@ef_bg},fg=#{@ef_orange}"
set -g window-status-activity-style "bg=#{@ef_red},fg=#{@ef_bg}"
set -g window-status-bell-style "bg=#{@ef_red},fg=#{@ef_bg},bold"
set -gF window-status-separator "#[bg=#{@ef_bg},fg=#{@ef_grey}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@ef_green},fg=#{@ef_bg},bold"

### === Status Line Left === ###
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@ef_red},fg=#{@ef_bg},bold]  #S },#{#[bg=#{@ef_bg},fg=#{@ef_green}]  #S }}"
set -ga status-left "#[bg=#{@ef_bg},fg=#{@ef_grey},none]│"
set -ga status-left "#[bg=#{@ef_bg},fg=#{@ef_red}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@ef_bg},fg=#{@ef_grey},none]│"
set -ga status-left "#[bg=#{@ef_bg},fg=#{@ef_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@ef_bg},fg=#{@ef_grey},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@ef_bg},fg=#{@ef_yellow}]#{?window_zoomed_flag,  zoom ,}"

### === Status Line Right === ###
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{@ef_bg},fg=#{@ef_grey},none]│"
set -ga status-right "#[bg=#{@ef_bg},fg=#{@ef_orange}] 󰻠 #[fg=#{@ef_fg}]"
set -ga status-right "#(tmux-mem-cpu-load --interval 2 --mem-mode 2 --graph-lines 0 --averages-count 0 | awk '{print $2}') "
set -ga status-right "#[bg=#{@ef_bg},fg=#{@ef_grey},none]│"
set -ga status-right "#[bg=#{@ef_bg},fg=#{@ef_aqua}] 󰘚 #[fg=#{@ef_fg}]"
set -ga status-right "#(tmux-mem-cpu-load --interval 2 --mem-mode 2 --graph-lines 0 --averages-count 0 | awk '{print $1}') "

### === Load Plugins === ###
run-shell "$TMUX_PLUGIN_MANAGER_PATH/sensible/sensible.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/vim-tmux-navigator/vim-tmux-navigator.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/yank/yank.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/resurrect/resurrect.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/continuum/continuum.tmux"
