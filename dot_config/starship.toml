"$schema" = 'https://starship.rs/config-schema.json'

# Quiet, context-gated prompt. Everything appears only when it means something.
format = """
$username$hostname$directory$git_branch$git_status$python$rust$golang$nodejs$cmd_duration$line_break$character"""
right_format = "$time"

palette = 'everforest'

[palettes.everforest]
bg = "#272e33"
fg = "#d3c6aa"
grey = "#859289"
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
yellow = "#dbbc7f"
orange = "#e69875"
red = "#e67e80"
purple = "#d699b6"

[username]
show_always = false          # shown over SSH / as root; hidden locally
style_user = "bold yellow"
style_root = "bold red"
format = '[$user ]($style)'

[hostname]
ssh_only = true              # remote shells are unmistakable, local stays clean
ssh_symbol = " "
style = "bold yellow"
format = '[$ssh_symbol$hostname ]($style)'

[directory]
style = "bold aqua"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "green"
format = '[on $symbol$branch ]($style)'

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind ]($style))'

[python]
symbol = "󰌠 "
style = "grey"
format = '[· $symbol$virtualenv$version ]($style)'
detect_extensions = []       # only in a venv or explicit python project
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]

[rust]
symbol = "󱘗 "
style = "grey"
format = '[· $symbol$version ]($style)'

[golang]
symbol = " "
style = "grey"
format = '[· $symbol$version ]($style)'

[nodejs]
symbol = " "
style = "grey"
format = '[· $symbol$version ]($style)'
detect_extensions = []
detect_files = ["package.json"]

[cmd_duration]
min_time = 2000
style = "grey"
format = '[· took $duration ]($style)'

[time]
disabled = false
time_format = "%H:%M"
style = "grey"
format = '[$time]($style)'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
